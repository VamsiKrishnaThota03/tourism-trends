{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tableau Web Data Connector · Tourism Trends Analyzer</title>
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
    <script src="https://connectors.tableau.com/libs/tableauwdc-2.3.latest.js"></script>
</head>
<body>
    <main class="container">
        <div class="auth-wrap">
            <div class="card">
                <div class="card-body p-4 text-center">
                    <img src="{% static 'img/favicon.svg' %}" alt="" width="48" height="48" class="mb-3">
                    <h1 class="h4 fw-bold">Tourism data for Tableau</h1>
                    <p class="text-secondary">Signed in as <strong>{{ user.username }}</strong>. Click connect to load your records into Tableau.</p>
                    <button id="submitButton" class="btn btn-primary btn-lg w-100">Connect to data</button>
                    <p id="wdcStatus" class="small text-secondary mt-3 mb-0" role="status"></p>
                </div>
            </div>
        </div>
    </main>

    <script>
    (function () {
        const dataUrl = '{% url "tableau_wdc_data" %}';
        const status = document.getElementById('wdcStatus');
        if (typeof tableau === 'undefined') {
            status.textContent = 'Open this page from Tableau (Connect → Web Data Connector).';
            document.getElementById('submitButton').disabled = true;
            return;
        }
        const connector = tableau.makeConnector();

        connector.getSchema = function (schemaCallback) {
            schemaCallback([{
                id: 'tourismData',
                alias: 'Tourism Data',
                columns: [
                    { id: 'Year', dataType: tableau.dataTypeEnum.int },
                    { id: 'Country', dataType: tableau.dataTypeEnum.string },
                    { id: 'Region', dataType: tableau.dataTypeEnum.string },
                    { id: 'Visitor_Count', dataType: tableau.dataTypeEnum.int },
                    { id: 'Visitor_Type', dataType: tableau.dataTypeEnum.string },
                    { id: 'Season', dataType: tableau.dataTypeEnum.string },
                    { id: 'Age_Group', dataType: tableau.dataTypeEnum.string },
                ],
            }]);
        };

        connector.getData = function (table, doneCallback) {
            fetch(dataUrl, { credentials: 'same-origin', headers: { Accept: 'application/json' } })
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(body => { table.appendRows(body.data); doneCallback(); })
                .catch(err => tableau.abortWithError('Could not load data: ' + err.message));
        };

        tableau.registerConnector(connector);
        document.getElementById('submitButton').addEventListener('click', function () {
            tableau.connectionName = 'Tourism Trends Data';
            tableau.submit();
        });
    })();
    </script>
</body>
</html>

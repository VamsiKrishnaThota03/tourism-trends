name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check
        env:
          DJANGO_DEBUG: 'true'

      - name: Migrations are complete (no missing makemigrations)
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: 'true'

      - name: Test
        run: python manage.py test --verbosity 2
        env:
          DJANGO_DEBUG: 'true'

  deploy-check:
    # `manage.py check --deploy` previously reported SECURE_HSTS_SECONDS and
    # SECURE_SSL_REDIRECT as missing. This job keeps the production posture
    # honest: a settings edit that regresses it fails here rather than shipping.
    name: deploy security check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: No deploy warnings other than the deliberate HSTS preload opt-out
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: example.com
        run: |
          set -uo pipefail
          export DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy --fail-level WARNING 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}

          # W021 is expected: HSTS preload is intentionally left off, because
          # submitting a domain to the browser preload list is permanent.
          remaining=$(grep -oE '\(security\.W[0-9]+\)' deploy.log | grep -v 'W021' || true)
          if [ -n "$remaining" ]; then
            echo "::error::unexpected deploy warnings: $remaining"
            exit 1
          fi
          echo "only the deliberate W021 preload opt-out remains"

      - name: A missing SECRET_KEY must stop the app, not fall back
        env:
          DJANGO_DEBUG: 'false'
        run: |
          set +e
          output=$(python manage.py check 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0 || { echo "::error::started without DJANGO_SECRET_KEY"; exit 1; }
          echo "$output" | grep -q "DJANGO_SECRET_KEY" \
            || { echo "::error::expected a DJANGO_SECRET_KEY error"; exit 1; }

  docker:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tourism-trends:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

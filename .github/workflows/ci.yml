name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check
        env:
          DJANGO_DEBUG: 'true'

      - name: Migrations are complete (no missing makemigrations)
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: 'true'

      - name: Test
        run: python manage.py test --verbosity 2
        env:
          DJANGO_DEBUG: 'true'

  deploy-check:
    # `manage.py check --deploy` previously reported SECURE_HSTS_SECONDS and
    # SECURE_SSL_REDIRECT as missing. This job keeps the production posture
    # honest: a settings edit that regresses it fails here rather than shipping.
    name: deploy security check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: check --deploy is clean at WARNING level
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: example.com
        run: |
          set -euo pipefail
          export DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')"
          # W021 (HSTS preload) is silenced in settings via
          # SILENCED_SYSTEM_CHECKS, scoped to that one check, because preload
          # submission is permanent and is left as an opt-in. Everything else
          # must be clean, so any new warning fails here.
          python manage.py check --deploy --fail-level WARNING
          echo "deploy check clean"

      - name: Opting into preload removes the silence rather than hiding it
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_HSTS_PRELOAD: 'true'
        run: |
          set -euo pipefail
          export DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')"
          # Proves the silence is conditional, not a blanket suppression.
          python manage.py check --deploy --fail-level WARNING
          python -c "
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'tourism_analyzer.settings')
          django.setup()
          from django.conf import settings
          assert settings.SECURE_HSTS_PRELOAD is True, 'preload should be on'
          assert not getattr(settings, 'SILENCED_SYSTEM_CHECKS', []), \
              'W021 must not stay silenced once preload is enabled'
          print('silence is conditional, as intended')
          "

      - name: A missing SECRET_KEY must stop the app, not fall back
        env:
          DJANGO_DEBUG: 'false'
        run: |
          set +e
          output=$(python manage.py check 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0 || { echo "::error::started without DJANGO_SECRET_KEY"; exit 1; }
          echo "$output" | grep -q "DJANGO_SECRET_KEY" \
            || { echo "::error::expected a DJANGO_SECRET_KEY error"; exit 1; }

  docker:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tourism-trends:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
